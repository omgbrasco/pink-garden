<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dumpling">
<meta name="theme-color" content="#ff8fc5">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="apple-touch-icon" href="assets/dumpling-icon.png?v=17">
<link rel="manifest" href="manifest.webmanifest?v=17">
<link rel="preload" as="image" href="assets/skin-blue.webp?v=17">
<link rel="preload" as="image" href="assets/garden.webp?v=17">
<link rel="preload" as="image" href="assets/moon.webp?v=17">
<link rel="preload" as="image" href="assets/dumpling-avatar.webp?v=17">
<link rel="stylesheet" href="styles.css?v=17">
<title>Dumpling</title>
</head>
<body data-tab="garden">
  <div id="app">
    <div id="stage">
      <div id="sky"></div>
      <div id="stars-far" aria-hidden="true"></div>
      <div id="garden">
        <img class="scene" id="garden-art" src="assets/skin-blue.webp?v=17" alt="">
        <img class="scene" id="moon-art" src="assets/moon.webp?v=17" alt="">
      </div>
      <div id="veil"></div>
      <div id="said" hidden></div>
      <div id="speech" hidden>
        <span id="speech-text"></span>
        <span class="dots" id="speech-dots" hidden><i></i><i></i><i></i></span>
      </div>
      <div id="sneaky" aria-hidden="true"><div class="shaft"></div><div class="head"></div><div class="balls"><span></span><span></span></div></div>
      <header id="title"><h1>Dumpling</h1></header>
      <div id="hud" hidden>
        <span id="hud-score">0/8</span>
        <button type="button" id="hud-done">Done</button>
      </div>
      <div id="buddy-wrap">
        <div id="thought" hidden>
          <span id="thought-text"></span>
          <span class="dots" id="thought-dots" hidden><i></i><i></i><i></i></span>
        </div>
        <button type="button" id="buddy" aria-label="Dumpling">
          <img src="assets/dumpling-avatar.webp?v=17" alt="">
        </button>
      </div>
    </div>
    <section id="chat">
      <div id="log"></div>
      <div id="chips"></div>
      <form id="form" autocomplete="off">
        <div class="composer">
          <div id="wave" hidden aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <input id="box" enterkeyhint="send" placeholder="Say hi…" maxlength="140" aria-label="Message Dumpling">
          <button type="button" id="mic" aria-label="Speak">
            <svg class="mic-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v3"/></svg>
          </button>
          <button type="submit" id="send" aria-label="Send">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3.4 20.6 21 12 3.4 3.4 3 10l11 2-11 2z"/></svg>
          </button>
        </div>
      </form>
    </section>
    <nav id="tabbar">
      <button type="button" data-tab="garden" class="on">Garden</button>
      <button type="button" data-tab="play">Catch</button>
      <button type="button" data-tab="glow">Glow</button>
    </nav>
  </div>
  <script src="app.js?v=17"></script>
</body>
</html>
