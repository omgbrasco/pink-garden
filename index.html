<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pink Garden</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
  body {
    background: #ff9ec8;
    color: #5a2450;
    touch-action: manipulation;
  }
  #sky {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 50% 8%, #ffe6f5 0%, #ffb3d9 28%, #ff7eb6 62%, #c96bff 100%);
  }
  #moon {
    position: absolute; top: 6%; left: 50%; width: 22vw; max-width: 140px; height: 22vw; max-height: 140px;
    margin-left: -11vw; border-radius: 50%;
    background: #ffd6f0;
    box-shadow: 0 0 40px #ff8fd0, 0 0 90px #ff4fbf66;
    animation: pulse 5s ease-in-out infinite;
  }
  .star {
    position: absolute; width: 6px; height: 6px; background: #fff;
    border-radius: 50%; animation: twinkle 2.2s ease-in-out infinite;
  }
  .firefly {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: #fff36a; box-shadow: 0 0 10px #ffe45c;
    animation: floaty 7s ease-in-out infinite;
  }
  #scene {
    position: fixed; inset: 0;
    background: url("garden.png") center bottom / cover no-repeat;
  }
  #veil {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, #ff9ec855 0%, transparent 35%, #ff6eb322 100%);
    pointer-events: none;
  }
  #friend-wrap {
    position: fixed; left: 50%; bottom: 11%;
    transform: translateX(-50%);
    width: min(42vw, 210px);
    z-index: 4;
    cursor: pointer;
    animation: idle 2.8s ease-in-out infinite;
  }
  #friend-wrap img {
    width: 100%; height: auto; display: block;
    filter: drop-shadow(0 12px 16px #ff4fbf55);
    border-radius: 28px;
  }
  .pet {
    position: fixed; z-index: 3; pointer-events: none;
    font-size: clamp(28px, 8vw, 52px);
    filter: drop-shadow(0 6px 0 #ff4fbf33);
  }
  .frog { left: 8%; bottom: 18%; animation: hop 2.4s ease-in-out infinite; }
  .frog2 { right: 10%; bottom: 22%; animation: hop 2.7s ease-in-out infinite .4s; }
  .kit { left: 18%; bottom: 8%; animation: sway 3.2s ease-in-out infinite; }
  .pup { right: 16%; bottom: 9%; animation: wag 1.1s ease-in-out infinite; }
  .kit2 { left: 6%; bottom: 32%; animation: sway 3.8s ease-in-out infinite .6s; }
  .pup2 { right: 5%; bottom: 34%; animation: wag 1.3s ease-in-out infinite .2s; }
  h1 {
    position: fixed; top: 18px; left: 0; right: 0; z-index: 5;
    text-align: center; font-size: clamp(18px, 5vw, 28px);
    color: #fff; text-shadow: 0 2px 0 #e85aa8, 0 8px 18px #ff4fbf66;
    letter-spacing: .04em;
  }
  h1 small { display: block; font-size: .45em; opacity: .9; margin-top: 4px; font-weight: 500; }
  #note {
    position: fixed; left: 50%; bottom: 4%; transform: translateX(-50%);
    z-index: 6; background: #fff7fb; color: #7a2d66;
    padding: 10px 16px; border-radius: 999px;
    font-size: 14px; box-shadow: 0 8px 0 #ff8fc5;
    max-width: 90%; text-align: center;
    animation: pop 2.8s ease-in-out infinite;
  }
  @keyframes idle { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-10px); } }
  @keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-18px) rotate(-8deg); } 55% { transform: translateY(0) rotate(0); } }
  @keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
  @keyframes wag { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } }
  @keyframes twinkle { 0%,100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.4); } }
  @keyframes floaty { 0%,100% { transform: translateY(0); opacity: .7; } 50% { transform: translateY(-24px); opacity: 1; } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes pop { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.04); } }
</style>
</head>
<body>
  <div id="sky"></div>
  <div id="moon"></div>
  <div id="scene"></div>
  <div id="veil"></div>
  <h1>Pink Garden<small>tap the little friend</small></h1>
  <div class="pet frog">🐸</div>
  <div class="pet frog2">🐸</div>
  <div class="pet kit">🐱</div>
  <div class="pet kit2">🐱</div>
  <div class="pet pup">🐶</div>
  <div class="pet pup2">🐶</div>
  <div id="friend-wrap" onclick="say()">
    <img src="friend.png" alt="little friend">
  </div>
  <div id="note">hi. i live here now.</div>
<script>
  const notes = [
    "hi. i live here now.",
    "the frogs are on night shift.",
    "kittens paid rent in purrs.",
    "dogs say you are the favorite human.",
    "moon is extra pink for you.",
    "i did a tiny hop. did you see.",
    "nobody has to understand computers.",
    "this whole garden is for you."
  ];
  function say() {
    const n = notes[Math.floor(Math.random() * notes.length)];
    document.getElementById("note").textContent = n;
  }
  const sky = document.getElementById("sky");
  for (let i = 0; i < 28; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 42 + "%";
    s.style.animationDelay = (Math.random() * 2) + "s";
    sky.appendChild(s);
  }
  for (let i = 0; i < 10; i++) {
    const f = document.createElement("div");
    f.className = "firefly";
    f.style.left = 10 + Math.random() * 80 + "%";
    f.style.bottom = 12 + Math.random() * 40 + "%";
    f.style.animationDelay = (Math.random() * 4) + "s";
    f.style.animationDuration = (5 + Math.random() * 5) + "s";
    document.body.appendChild(f);
  }
</script>
</body>
</html>
