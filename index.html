<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dumpling">
<meta name="theme-color" content="#ff8fc5">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="apple-touch-icon" href="assets/dumpling-icon.png?v=33">
<link rel="manifest" href="manifest.webmanifest?v=33">
<link rel="preload" as="image" href="assets/garden.webp?v=33">
<link rel="preload" as="image" href="assets/skin-blue.webp?v=33">
<link rel="preload" as="image" href="assets/moon.webp?v=33">
<link rel="preload" as="image" href="assets/dumpling-avatar.webp?v=33">
<link rel="stylesheet" href="styles.css?v=33">
<title>Dumpling</title>
</head>
<body data-tab="home">
  <div id="app">
    <div id="stage">
      <div id="sky"></div>
      <div id="stars-far" aria-hidden="true"></div>
      <div id="garden">
        <img class="scene" id="garden-art" src="assets/garden.webp?v=33" alt="">
        <img class="scene" id="moon-art" src="assets/moon.webp?v=33" alt="">
      </div>
      <div id="veil"></div>
      <div id="said" hidden></div>
      <div id="speech" hidden>
        <span id="speech-text"></span>
        <span class="dots" id="speech-dots" hidden><i></i><i></i><i></i></span>
      </div>
      <header id="title"><h1>Dumpling</h1></header>
      <button type="button" id="menu-btn" aria-label="Menu" aria-controls="drawer" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div id="hud" hidden>
        <span id="hud-score">0/8</span>
        <button type="button" id="hud-done">Done</button>
      </div>
      <div id="buddy-wrap">
        <div id="thought" hidden>
          <span id="thought-text"></span>
          <span class="dots" id="thought-dots" hidden><i></i><i></i><i></i></span>
        </div>
        <button type="button" id="buddy" aria-label="Dumpling">
          <img src="assets/dumpling-avatar.webp?v=33" alt="">
        </button>
      </div>
    </div>
    <section id="chat">
      <div id="log"></div>
      <div id="chips"></div>
      <form id="form" autocomplete="off">
        <div class="composer">
          <div id="wave" hidden aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <input id="box" enterkeyhint="send" placeholder="Say hi…" maxlength="140" aria-label="Message Dumpling">
          <button type="button" id="mic" aria-label="Speak">
            <svg class="mic-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v3"/></svg>
          </button>
          <button type="submit" id="send" aria-label="Send">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3.4 20.6 21 12 3.4 3.4 3 10l11 2-11 2z"/></svg>
          </button>
        </div>
      </form>
    </section>
    <div id="chats-screen" class="screen">
      <div class="screen-inner">
        <div class="screen-head"><button type="button" class="back" data-go="home" aria-label="Back"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Chat history</h2></div>
        <div id="chats-list"></div>
      </div>
    </div>
    <div id="list-screen" class="screen">
      <div class="screen-inner">
        <div class="screen-head"><button type="button" class="back" data-go="home" aria-label="Back"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2>My list</h2></div>
        <form id="list-add" class="list-add" autocomplete="off">
          <input id="list-input" maxlength="120" enterkeyhint="done" placeholder="Add something…" aria-label="Add to my list">
          <button type="submit" aria-label="Add"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </form>
        <div id="list-items"></div>
        <div id="list-empty" hidden>
          <img src="assets/dumpling-avatar.webp?v=33" alt="">
          <p>Try: “add milk to my list”<br>or “remind me to call mom at 5”</p>
        </div>
        <button type="button" id="list-clear" hidden>Clear done</button>
      </div>
    </div>
    <div id="settings-screen" class="screen">
      <div class="screen-inner">
        <div class="screen-head"><button type="button" class="back" data-go="home" aria-label="Back"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Settings</h2></div>
        <div class="s-group">
          <h3>Garden</h3>
          <div class="s-row">
            <span>Skin</span>
            <div class="s-seg" id="seg-skin">
              <button type="button" data-skin="pink">Pink garden</button>
              <button type="button" data-skin="blue">Blue night</button>
            </div>
          </div>
          <div class="s-row">
            <span>Light</span>
            <div class="s-seg" id="seg-night">
              <button type="button" data-night="0">Morning</button>
              <button type="button" data-night="1">Night</button>
            </div>
          </div>
          <div class="s-row" id="moon-row">
            <span>Moon color</span>
            <div class="s-swatches" id="moon-swatches"></div>
          </div>
        </div>
        <div class="s-group" id="ideas">
          <h3>Feedback</h3>
          <div class="fb-type">
            <textarea id="fb-text" placeholder="Type it…" maxlength="600" rows="2" enterkeyhint="send" aria-label="Type feedback"></textarea>
            <button type="button" id="fb-send" aria-label="Send">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3.4 20.6 21 12 3.4 3.4 3 10l11 2-11 2z"/></svg>
            </button>
          </div>
          <button type="button" id="fb-rec" class="fb-say">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v3"/></svg>
            <span id="fb-rec-label">Say it</span>
          </button>
          <p id="fb-status" hidden></p>
        </div>
      </div>
    </div>
    <div id="scrim"></div>
    <aside id="drawer" aria-label="Menu" aria-hidden="true" inert>
      <div class="dr-head">
        <img src="assets/dumpling-avatar.webp?v=33" alt="">
        <div>
          <strong>Dumpling</strong>
          <span id="streak" hidden><span id="streak-n"></span></span>
        </div>
      </div>
      <div class="dr-list">
        <button type="button" data-go="list"><span class="dr-ico">📝</span>My list<span id="dr-list-n" class="dr-count" hidden></span></button>
        <button type="button" data-go="chats"><span class="dr-ico">💬</span>Chat history</button>
        <button type="button" data-go="skin" id="dr-skin"><span class="dr-ico">🌸</span><span id="dr-skin-label">Pink garden</span></button>
        <button type="button" data-go="catch"><span class="dr-ico">✨</span>Catch fireflies</button>
        <button type="button" data-go="settings"><span class="dr-ico">⚙️</span>Settings</button>
      </div>
    </aside>
    <div id="news" hidden>
      <div class="news-card" role="dialog" aria-modal="true" aria-labelledby="news-text">
        <img class="news-dumpling" src="assets/dumpling-avatar.webp?v=33" alt="">
        <div class="news-bubble"><div id="news-text"></div><div class="news-dots" id="news-dots" hidden></div></div>
        <button type="button" id="news-go" class="news-go">Show me</button>
        <button type="button" id="news-ok" class="news-ok">Got it</button>
      </div>
    </div>
  </div>
  <script src="app.js?v=33"></script>
</body>
</html>
