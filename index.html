<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dumpling">
<meta name="theme-color" content="#ff8fc5">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="apple-touch-icon" href="dumpling-icon.png?v=8">
<link rel="manifest" href="manifest.webmanifest?v=8">
<link rel="preload" as="image" href="garden.webp?v=8">
<link rel="preload" as="image" href="moon.webp?v=8">
<link rel="preload" as="image" href="dumpling-avatar.webp?v=8">
<link rel="stylesheet" href="styles.css?v=8">
<title>Dumpling</title>
</head>
<body>
  <div id="app">
    <div id="stage">
      <div id="sky"></div>
      <div id="garden">
        <img class="scene" id="garden-art" src="garden.webp?v=8" alt="">
        <img class="scene" id="moon-art" src="moon.webp?v=8" alt="">
      </div>
      <div id="veil"></div>
      <div id="sneaky" aria-hidden="true"><div class="shaft"></div><div class="head"></div><div class="balls"><span></span><span></span></div></div>
      <header id="title"><h1>Dumpling</h1></header>
      <div id="hud" hidden>
        <span id="hud-score">0/8</span>
        <button type="button" id="hud-done">Done</button>
      </div>
      <div id="buddy-wrap">
        <div id="thought" hidden>
          <span id="thought-text"></span>
          <span class="dots" id="thought-dots" hidden><i></i><i></i><i></i></span>
        </div>
        <button type="button" id="buddy" aria-label="Dumpling">
          <img src="dumpling-avatar.webp?v=8" alt="">
        </button>
      </div>
    </div>
    <section id="chat">
      <div id="log"></div>
      <div id="chips"></div>
      <form id="form" autocomplete="off">
        <input id="box" enterkeyhint="send" placeholder="Say hi, or make the moon green" maxlength="140">
        <button type="submit">Send</button>
      </form>
    </section>
  </div>
  <script src="app.js?v=8"></script>
</body>
</html>
